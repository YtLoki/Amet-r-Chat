<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amet-r-Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #0b0e14; color: #e1e6ed; }

        /* Auth View */
        .auth-container { 
            position: fixed; inset: 0; margin: auto;
            width: 90%; max-width: 360px; height: fit-content;
            background: #151922; padding: 25px; border-radius: 12px; border: 1px solid #232936; 
        }
        .auth-container h2 { margin-bottom: 20px; text-align: center; font-size: 20px; }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2a3245; background: #0b0e14; color: #fff; font-size: 14px; }
        .toggle-btn { position: absolute; right: 8px; top: 10px; background: transparent; border: 1px solid #444; color: #ccc; padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: #5865f2; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .auth-extras { display: flex; justify-content: space-between; font-size: 12px; margin-top: 10px; color: #a0a0a0; }
        .auth-extras a { color: #5865f2; text-decoration: none; cursor: pointer; }

        /* Main App Container */
        .app-container { display: none; width: 100vw; height: 100dvh; flex-direction: row; position: relative; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { 
            width: 320px; height: 100%; background: #151922; border-right: 1px solid #232936; 
            display: flex; flex-direction: column; z-index: 10; flex-shrink: 0;
        }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #232936; display: flex; justify-content: space-between; align-items: center; background: #10131b; }
        .close-sidebar-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; display: none; }

        .tabs { display: flex; border-bottom: 1px solid #232936; background: #10131b; }
        .tab-btn { flex: 1; padding: 12px 2px; background: none; border: none; color: #8a93a0; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #5865f2; }

        .badge { background: #ed4245; color: white; border-radius: 10px; padding: 1px 5px; font-size: 9px; margin-left: 2px; }
        .badge:empty, .badge[data-count="0"] { display: none; }

        .tab-content { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { background: #1c2230; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .item-actions { display: flex; gap: 4px; flex-shrink: 0; }

        /* Chat Area */
        .chat-area { flex: 1; height: 100%; display: flex; flex-direction: column; background: #0b0e14; position: relative; min-width: 0; }
        .chat-header { padding: 12px 15px; background: #151922; border-bottom: 1px solid #232936; display: flex; align-items: center; gap: 10px; height: 55px; flex-shrink: 0; }
        .open-sidebar-btn { background: #232936; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-item { background: #1c2230; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-break: break-word; font-size: 14px; }
        .message-item.own { align-self: flex-end; background: #5865f2; }
        .message-info { font-size: 10px; opacity: 0.7; margin-bottom: 3px; display: flex; justify-content: space-between; gap: 10px; }

        .chat-input-area { padding: 10px; background: #151922; border-top: 1px solid #232936; display: flex; gap: 8px; height: 60px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #232936; background: #0b0e14; color: white; font-size: 14px; min-width: 0; }

        .btn-sm { padding: 5px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: 600; }
        .btn-danger { background: #ed4245; }
        .btn-success { background: #3ba55d; }
        .btn-warning { background: #faa61a; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-content { background: #151922; padding: 20px; border-radius: 8px; width: 100%; max-width: 320px; border: 1px solid #232936; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed; inset: 0; width: 100%; height: 100dvh; z-index: 50;
                transform: translateX(0); transition: transform 0.2s ease;
            }
            .sidebar.collapsed { transform: translateX(-100%); display: flex !important; }
            .close-sidebar-btn { display: block; }
            .message-item { max-width: 85%; }
        }
    </style>
</head>
<body>

    <div id="auth-view" class="auth-container">
        <h2 id="auth-title">Giriş Yap</h2>
        <div class="input-group">
            <input type="text" id="auth-username" placeholder="Kullanıcı Adı veya Tag">
        </div>
        <div class="input-group">
            <input type="password" id="auth-password" placeholder="Şifre">
            <button type="button" class="toggle-btn" onclick="togglePassword('auth-password', this)">Göster</button>
        </div>

        <div class="auth-extras">
            <label><input type="checkbox" id="remember-me"> Beni Hatırla</label>
            <a onclick="showForgotPassword()">Şifremi Unuttum</a>
        </div>

        <button class="btn" id="auth-btn" onclick="handleAuth()">Giriş Yap</button>
        <div style="text-align: center; margin-top: 15px; font-size: 13px;">
            <a onclick="toggleAuthMode()" id="auth-switch" style="color:#5865f2; cursor:pointer;">Hesabın yok mu? Kayıt Ol</a>
        </div>
    </div>

    <div id="app-view" class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span id="user-display-tag" style="font-weight: bold; font-size: 13px;"></span>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('friends')">Arkadaşlar</button>
                <button class="tab-btn" onclick="switchTab('groups')">Gruplar <span id="badge-groups" class="badge">0</span></button>
                <button class="tab-btn" onclick="switchTab('requests')">İstekler <span id="badge-requests" class="badge">0</span></button>
                <button class="tab-btn" onclick="switchTab('blocked')">Engeller</button>
            </div>

            <div class="tab-content">
                <div id="tab-friends">
                    <div style="display:flex; gap:5px; margin-bottom:10px;">
                        <input type="text" id="friend-tag-input" placeholder="#1234 Tag ile Ekle" style="flex:1; padding:8px; background:#0b0e14; border:1px solid #232936; color:white; border-radius:4px; font-size:12px;">
                        <button class="btn-sm btn-success" onclick="sendFriendRequest()">Ekle</button>
                    </div>
                    <div id="friends-list"></div>
                </div>

                <div id="tab-groups" style="display:none;">
                    <button class="btn" style="margin-bottom:10px; padding:8px;" onclick="showCreateGroupModal()">+ Yeni Grup Kur</button>
                    <div id="groups-list"></div>
                </div>

                <div id="tab-requests" style="display:none;">
                    <div id="requests-list"></div>
                </div>

                <div id="tab-blocked" style="display:none;">
                    <div id="blocked-list"></div>
                </div>
            </div>
        </div>

        <div class="chat-area" id="chat-area">
            <div class="chat-header">
                <button class="open-sidebar-btn" onclick="toggleSidebar()">☰ Menü</button>
                <h3 id="current-room-title" style="font-size:14px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Bir Sohbet Seçin</h3>
            </div>
            <div class="messages-box" id="messages-box"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="btn-sm btn-success" style="padding: 0 15px;" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <div class="modal" id="forgot-modal">
        <div class="modal-content">
            <h3>Şifre Sıfırla</h3>
            <input type="text" id="fp-username" placeholder="Kullanıcı Adı" style="width:100%; margin:10px 0; padding:8px; background:#0b0e14; border:1px solid #232936; color:white;">
            <input type="text" id="fp-tag" placeholder="Etiket (#1234)" style="width:100%; margin-bottom:10px; padding:8px; background:#0b0e14; border:1px solid #232936; color:white;">
            <div class="input-group">
                <input type="password" id="fp-new-pass" placeholder="Yeni Şifre">
                <button type="button" class="toggle-btn" onclick="togglePassword('fp-new-pass', this)">Göster</button>
            </div>
            <button class="btn" onclick="submitForgotPassword()">Şifreyi Güncelle</button>
            <button class="btn btn-danger" onclick="closeModal('forgot-modal')" style="margin-top:5px;">Kapat</button>
        </div>
    </div>

    <div class="modal" id="group-modal">
        <div class="modal-content">
            <h3>Grup Oluştur</h3>
            <input type="text" id="group-name-input" placeholder="Grup Adı" style="width:100%; margin:10px 0; padding:8px; background:#0b0e14; border:1px solid #232936; color:white;">
            <h4 style="font-size:12px; margin-bottom:5px;">Üye Ekle:</h4>
            <div id="group-friends-select" style="max-height:120px; overflow-y:auto; margin-bottom:10px;"></div>
            <button class="btn" onclick="submitCreateGroup()">Grup Kur</button>
            <button class="btn btn-danger" onclick="closeModal('group-modal')" style="margin-top:5px;">Kapat</button>
        </div>
    </div>

    <script>
        const socket = io();
        let isLoginMode = true;
        let currentUserFullTag = '';
        let currentUserData = { friends: [], friendRequests: [], blockedUsers: [], groups: [] };
        let activeRoom = null;
        let unreadGroupMessages = 0;

        window.onload = () => {
            const rememberedTag = localStorage.getItem('remembered_fullTag');
            if (rememberedTag) {
                currentUserFullTag = rememberedTag;
                document.getElementById('user-display-tag').innerText = currentUserFullTag;
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'flex';
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('collapsed');
                }
                socket.emit('register_user', currentUserFullTag);
                loadUserData();
            }
        };

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'Gizle';
            } else {
                input.type = 'password';
                btn.innerText = 'Göster';
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('auth-switch').innerText = isLoginMode ? 'Hesabın yok mu? Kayıt Ol' : 'Zaten hesabın var mı? Giriş Yap';
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const remember = document.getElementById('remember-me').checked;

            if (!username || !password) return alert('Lütfen tüm alanları doldurun.');

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.error) return alert(data.error);

            currentUserFullTag = data.fullTag;
            document.getElementById('user-display-tag').innerText = currentUserFullTag;

            if (remember) {
                localStorage.setItem('remembered_fullTag', currentUserFullTag);
            } else {
                localStorage.removeItem('remembered_fullTag');
            }

            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'flex';

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('collapsed');
            }

            socket.emit('register_user', currentUserFullTag);
            loadUserData();
        }

        function showForgotPassword() { document.getElementById('forgot-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitForgotPassword() {
            const username = document.getElementById('fp-username').value.trim();
            const userTag = document.getElementById('fp-tag').value.trim();
            const newPassword = document.getElementById('fp-new-pass').value.trim();

            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, userTag, newPassword })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('Şifreniz güncellendi.'); closeModal('forgot-modal'); }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function switchTab(tabName) {
            ['friends', 'groups', 'requests', 'blocked'].forEach(t => {
                document.getElementById(`tab-${t}`).style.display = t === tabName ? 'block' : 'none';
            });
            if (tabName === 'groups') {
                unreadGroupMessages = 0;
                updateBadges();
            }
        }

        async function loadUserData() {
            if (!currentUserFullTag) return;
            const res = await fetch('/api/get-user-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullTag: currentUserFullTag })
            });
            currentUserData = await res.json();

            renderFriends();
            renderGroups();
            renderRequests();
            renderBlocked();
            updateBadges();
        }

        function updateBadges() {
            const reqBadge = document.getElementById('badge-requests');
            reqBadge.innerText = currentUserData.friendRequests.length;
            reqBadge.setAttribute('data-count', currentUserData.friendRequests.length);

            const grpBadge = document.getElementById('badge-groups');
            grpBadge.innerText = unreadGroupMessages;
            grpBadge.setAttribute('data-count', unreadGroupMessages);
        }

        function renderFriends() {
            const box = document.getElementById('friends-list');
            box.innerHTML = '';
            currentUserData.friends.forEach(friend => {
                box.innerHTML += `
                    <div class="list-item" onclick="openDM('${friend}')">
                        <span style="font-size:12px; overflow:hidden; text-overflow:ellipsis;">${friend}</span>
                        <div class="item-actions">
                            <button class="btn-sm btn-warning" onclick="event.stopPropagation(); removeFriend('${friend}')">Çıkar</button>
                            <button class="btn-sm btn-danger" onclick="event.stopPropagation(); blockUser('${friend}')">Engelle</button>
                        </div>
                    </div>`;
            });
        }

        function renderGroups() {
            const box = document.getElementById('groups-list');
            box.innerHTML = '';
            currentUserData.groups.forEach(g => {
                box.innerHTML += `
                    <div class="list-item" onclick="openGroup('${g.groupName}')">
                        <span style="font-size:12px;"># ${g.groupName}</span>
                        <button class="btn-sm btn-danger" onclick="event.stopPropagation(); leaveGroup('${g.groupName}')">Çık</button>
                    </div>`;
            });
        }

        function renderRequests() {
            const box = document.getElementById('requests-list');
            box.innerHTML = '';
            currentUserData.friendRequests.forEach(req => {
                box.innerHTML += `
                    <div class="list-item">
                        <span style="font-size:12px; overflow:hidden; text-overflow:ellipsis;">${req}</span>
                        <div class="item-actions">
                            <button class="btn-sm btn-success" onclick="acceptRequest('${req}')">Kabul</button>
                            <button class="btn-sm btn-danger" onclick="rejectRequest('${req}')">Red</button>
                        </div>
                    </div>`;
            });
        }

        function renderBlocked() {
            const box = document.getElementById('blocked-list');
            box.innerHTML = '';
            currentUserData.blockedUsers.forEach(b => {
                box.innerHTML += `
                    <div class="list-item">
                        <span style="font-size:12px; overflow:hidden; text-overflow:ellipsis;">${b}</span>
                        <button class="btn-sm btn-success" onclick="unblockUser('${b}')">Kaldır</button>
                    </div>`;
            });
        }

        async function sendFriendRequest() {
            const targetInput = document.getElementById('friend-tag-input').value.trim();
            const res = await fetch('/api/send-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderFullTag: currentUserFullTag, targetInput })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('İstek gönderildi.'); document.getElementById('friend-tag-input').value = ''; }
        }

        async function acceptRequest(requesterFullTag) {
            await fetch('/api/accept-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userFullTag: currentUserFullTag, requesterFullTag })
            });
            loadUserData();
        }

        async function rejectRequest(requesterFullTag) {
            await fetch('/api/reject-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userFullTag: currentUserFullTag, requesterFullTag })
            });
            loadUserData();
        }

        async function removeFriend(friendFullTag) {
            await fetch('/api/remove-friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userFullTag: currentUserFullTag, friendFullTag })
            });
            loadUserData();
        }

        async function blockUser(targetFullTag) {
            await fetch('/api/block-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userFullTag: currentUserFullTag, targetFullTag })
            });
            loadUserData();
        }

        async function unblockUser(targetFullTag) {
            await fetch('/api/unblock-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userFullTag: currentUserFullTag, targetFullTag })
            });
            loadUserData();
        }

        async function leaveGroup(groupName) {
            await fetch('/api/leave-group', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullTag: currentUserFullTag, groupName })
            });
            loadUserData();
        }

        function showCreateGroupModal() {
            const selectBox = document.getElementById('group-friends-select');
            selectBox.innerHTML = '';
            currentUserData.friends.forEach(f => {
                selectBox.innerHTML += `<label style="display:block; font-size:12px; margin-bottom:4px;"><input type="checkbox" value="${f}" class="grp-cb"> ${f}</label>`;
            });
            document.getElementById('group-modal').style.display = 'flex';
        }

        async function submitCreateGroup() {
            const groupName = document.getElementById('group-name-input').value.trim();
            const members = Array.from(document.querySelectorAll('.grp-cb:checked')).map(cb => cb.value);

            const res = await fetch('/api/create-group', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ groupName, creator: currentUserFullTag, members })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { closeModal('group-modal'); loadUserData(); }
        }

        function openDM(friendTag) {
            activeRoom = [currentUserFullTag, friendTag].sort().join('_');
            document.getElementById('current-room-title').innerText = friendTag;
            if (window.innerWidth <= 768) toggleSidebar();
            socket.emit('join room', activeRoom);
        }

        function openGroup(groupName) {
            activeRoom = `group_${groupName}`;
            document.getElementById('current-room-title').innerText = `# ${groupName}`;
            if (window.innerWidth <= 768) toggleSidebar();
            socket.emit('join room', activeRoom);
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeRoom) return;

            socket.emit('chat message', { room: activeRoom, sender: currentUserFullTag, text });
            input.value = '';
        }

        socket.on('load_room_messages', (messages) => {
            const box = document.getElementById('messages-box');
            box.innerHTML = '';
            messages.forEach(m => appendMessage(m));
        });

        socket.on('chat message', (data) => {
            if (data.room === activeRoom) {
                appendMessage(data);
            } else {
                unreadGroupMessages++;
                updateBadges();
            }
        });

        socket.on('update_data', () => {
            loadUserData();
        });

        function appendMessage(m) {
            const box = document.getElementById('messages-box');
            const isOwn = m.sender === currentUserFullTag;
            box.innerHTML += `
                <div class="message-item ${isOwn ? 'own' : ''}">
                    <div class="message-info"><span>${m.sender}</span><span>${m.time}</span></div>
                    <div>${m.text}</div>
                </div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
